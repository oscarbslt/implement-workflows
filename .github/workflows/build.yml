name: CMake C/C++ CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Récupère le code du dépôt
    - name: Récupérer le code
      uses: actions/checkout@v4

    # 2. Installe CMake et le compilateur GCC
    - name: Installer CMake et GCC
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    # 3. Configure le projet (génère les Makefiles dans le dossier 'build')
    - name: Configurer CMake
      run: cmake -B build -S .

    # 4. Compile le projet
    - name: Compiler le projet
      run: cmake --build build

    # 5. Optionnel : Lance les tests si vous utilisez CTest
    # - name: Exécuter les tests
    #   run: cd build && ctest --output-on-failure
